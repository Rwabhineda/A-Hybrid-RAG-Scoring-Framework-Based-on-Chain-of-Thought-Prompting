# ASEAN Legal Clause Scoring Configuration
# Model: GPT-5 with Full RAG

experiment:
  name: "gpt-5-full-rag"
  description: "GPT-5 with full RAG pipeline"

paths:
  input_file: "data/processed/test_articles.json"
  output_file: "outputs/gpt-5/results.jsonl"
  exception_log: "logs/gpt-5_exceptions.log"
  cache_dir: "data/cache/gpt-5"

vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

models:
  openai:
    model: "gpt-5"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: ""
  embedding:
    model: "sentence-transformers/all-mpnet-base-v2"
  filter:
    model: "nlpaueb/legal-bert-base-uncased"

retrieval:
  top_k: 5
  similarity_threshold: 1.0

runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

features:
  wrd_enabled: false
  zero_shot: false
  use_rag: true
