# 2. RAG 

experiment:
  name: "gpt-4-turbo-rag"
  description: "RAG + base prompt only, with Legal-BERT CE filter"

paths:
  input_file: "data/processed/asean/test_articles.json"
  output_file: "outputs/asean/gpt-4-turbo/rag/results.jsonl"
  exception_log: "outputs/asean/gpt-4-turbo/rag/exception.jsonl"
  cache_dir: "data/cache/asean/gpt-4-turbo/rag"

vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

models:
  openai:
    model: "gpt-4-turbo"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: ""
    temperature: 0.0
    max_tokens: 1200
  embedding:
    model: "intfloat/e5-large-v2"
  filter:
    model: "nlpaueb/legal-bert-base-uncased"

retrieval:
  top_k: 5
  similarity_threshold: 1.0

runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

features:
  wrd_enabled: true
  use_rag: true
  use_cot_guide: false
