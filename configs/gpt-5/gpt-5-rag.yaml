# 2. RAG + 基础提示 (no COT)，默�?E5 过滤

experiment:
  name: "gpt-5-rag"
  description: "RAG + base prompt only, with E5 filter (no COT)"

paths:
  input_file: "data/processed/test_articles.json"
  output_file: "outputs/gpt-5-rag/results.jsonl"
  exception_log: "logs/gpt-5-rag_exceptions.log"
  cache_dir: "data/cache/gpt-5-rag"

vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

models:
  openai:
    model: "gpt-5"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: ""
    temperature: 0.0
  embedding:
    model: "sentence-transformers/all-mpnet-base-v2"
  filter:
    model: "intfloat/e5-large-v2"

retrieval:
  top_k: 5
  similarity_threshold: 1.0
  relevance_threshold: 0.6

runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

features:
  wrd_enabled: true
  use_rag: true
  use_cot_guide: false
