# 1. 仅基础提示 (no RAG, no COT)

experiment:
  name: "gpt-3.5-turbo-base"
  description: "Base prompt only (no RAG, no COT)"

paths:
  input_file: "data/processed/test_articles.json"
  output_file: "outputs/gpt-3.5-turbo/base/results.jsonl"
  exception_log: "outputs/gpt-3.5-turbo/base/exception.jsonl"
  cache_dir: "data/cache/gpt-3.5-turbo/base"

vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

models:
  openai:
    model: "gpt-3.5-turbo"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: ""
    temperature: 0.0
    max_tokens: 800
  embedding:
    model: "intfloat/e5-large-v2"
  filter:
    model: "nlpaueb/legal-bert-base-uncased"

retrieval:
  top_k: 5
  similarity_threshold: 1.0

runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

features:
  wrd_enabled: false
  use_rag: false
  use_cot_guide: false
