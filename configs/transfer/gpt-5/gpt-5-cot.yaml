# 3. COT + 基础提示 (no RAG)

experiment:
  name: "gpt-5-transfer-cot"
  description: "COT scoring guide + base prompt only (no RAG)"

paths:
  input_file: "data/processed/transfer/test_articles.json"
  output_file: "outputs/transfer/gpt-5-transfer/cot/results.jsonl"
  exception_log: "outputs/transfer/gpt-5-transfer/cot/exception.jsonl"
  cache_dir: "data/cache/transfer/gpt-5-transfer/cot"

vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

models:
  openai:
    model: "gpt-5-transfer"
    api_url: "https://api.openai.com/v1/responses"
    api_key: ""
    temperature: null
    max_output_tokens: 4096
    structured_outputs: false
  embedding:
    model: "intfloat/e5-large-v2"
  filter:
    model: "nlpaueb/legal-bert-base-uncased"

retrieval:
  top_k: 5
  similarity_threshold: 1.0

runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

features:
  wrd_enabled: false
  use_rag: false
  use_cot_guide: true
