# ASEAN Legal Clause Scoring Configuration
# Model: GPT-4o with Full RAG

experiment:
  name: "gpt-4o-full-rag"
  description: "GPT-4o with full RAG pipeline"

# File Paths (relative to project root)
paths:
  input_file: "data/processed/test_articles.json"
  output_file: "outputs/gpt-4o/results.jsonl"
  exception_log: "logs/gpt-4o_exceptions.log"
  cache_dir: "data/cache/gpt-4o"

# Vector Database
vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

# Models
models:
  openai:
    model: "gpt-4o"
    api_url: "https://api.openai.com/v1/chat/completions"
    api_key: ""  # Set via OPENAI_API_KEY environment variable
  embedding:
    model: "sentence-transformers/all-mpnet-base-v2"
  filter:
    model: "nlpaueb/legal-bert-base-uncased"

# Retrieval Settings
retrieval:
  top_k: 5
  similarity_threshold: 1.0

# Runtime Settings
runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

# Feature Flags
features:
  wrd_enabled: false
  zero_shot: false
  use_rag: true
