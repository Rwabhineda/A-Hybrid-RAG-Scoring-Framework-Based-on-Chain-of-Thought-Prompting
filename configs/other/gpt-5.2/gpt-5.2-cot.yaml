# COT mode: base prompt + COT scoring guide (no RAG)

experiment:
  name: "gpt-5.2-cot"
  description: "COT: base prompt + COT scoring guide, no RAG"

paths:
  input_file: "data/processed/other/test_articles.json"
  output_file: "outputs/other/gpt-5.2/cot/results.jsonl"
  exception_log: "outputs/other/gpt-5.2/cot/exception.jsonl"
  cache_dir: "data/cache/other/gpt-5.2/cot"

vector_db:
  chroma_dir: "data/rag/chroma_db"
  collection_name: "asean_scoring"

models:
  openai:
    model: "gpt-5.2"
    api_url: "https://api.openai.com/v1/responses"
    api_key: ""
    temperature: 0
    max_output_tokens: 4096
    structured_outputs: false
    reasoning:
      effort: "none"
  embedding:
    model: "intfloat/e5-large-v2"
  filter:
    model: "nlpaueb/legal-bert-base-uncased"

retrieval:
  top_k: 5
  similarity_threshold: 1.0

runtime:
  max_concurrent: 3
  batch_size: 9
  request_timeout: 300

features:
  wrd_enabled: false
  use_rag: false
  use_cot_guide: true
