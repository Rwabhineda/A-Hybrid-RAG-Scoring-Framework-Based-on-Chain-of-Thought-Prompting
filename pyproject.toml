[project]
name = "asean-legal-scoring"
version = "0.1.0"
description = "Legal clause scoring system for ASEAN documents using LLM and RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
]

[tool.uv]
python-downloads = "automatic"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]
